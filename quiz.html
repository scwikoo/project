<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тест</title>

<style>
body {
  background: linear-gradient(to bottom, #ffe4ec, #fff);
  font-family: Arial;
}

/* результат */
.result {
  margin-top: 20px;
  padding: 15px;
  display: none;
  font-weight: bold;
  border-radius: 10px;
}

.correct {
  background-color: #c8f7c5;
  animation: fade 0.5s;
}

.wrong {
  background-color: #f7c5c5;
  animation: shake 0.3s;
}

/* анимации */
@keyframes fade {
  from {opacity: 0;}
  to {opacity: 1;}
}

@keyframes shake {
  0% {transform: translateX(0);}
  25% {transform: translateX(-5px);}
  50% {transform: translateX(5px);}
  75% {transform: translateX(-5px);}
  100% {transform: translateX(0);}
}
</style>

<script>
function checkAnswers() {
  let score = 0;

  let q1 = document.querySelector('input[name="q1"]:checked');
  let q2 = document.querySelector('input[name="q2"]:checked');

  let result = document.getElementById("result");

  if (!q1 || !q2) {
    result.style.display = "block";
    result.className = "result wrong";
    result.innerHTML = "Ответь на все вопросы!";
    return;
  }

  if (q1.value === "correct") score++;
  if (q2.value === "correct") score++;

  result.style.display = "block";

  if (score === 2) {
    result.className = "result correct";
    result.innerHTML = "✨ Всё правильно!";
  } else {
    result.className = "result wrong";
    result.innerHTML = "❌ Есть ошибки!";
  }
}
</script>

</head>

<h2>Тест</h2>

<p>1. Что увлажняет кожу?</p>
<input type="radio" name="q1" value="wrong"> Пудра<br>
<input type="radio" name="q1" value="correct"> Крем<br>

<p>2. Что такое кушон?</p>
<input type="radio" name="q2" value="correct"> Тональное средство<br>
<input type="radio" name="q2" value="wrong"> Помада<br>

<br>

<button type="button" onclick="checkAnswers()">
Проверить ответы
</button>

</body>
</html>
