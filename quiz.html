<script>
function checkAnswers() {
    let score = 0;
    let q1 = document.querySelector('input[name="q1"]:checked');
    let q2 = document.querySelector('input[name="q2"]:checked');
    let q3 = document.querySelector('input[name="q3"]:checked');
    let q4 = document.querySelector('input[name="q4"]:checked');
    let q5 = document.querySelector('input[name="q5"]:checked');
    let result = document.getElementById("result");

    // если не все вопросы отвечены
    if (!q1 || !q2 || !q3 || !q4 || !q5) {
        result.style.display = "block";
        result.className = "result wrong";
        result.innerHTML = "❌ Ответьте на все вопросы!";
        return;
    }

    // проверка
    if (q1.value === "correct") score++;
    if (q2.value === "correct") score++;
    if (q3.value === "correct") score++;
    if (q4.value === "correct") score++;
    if (q5.value === "correct") score++;

    result.style.display = "block";

    // результат
    if (score === 5) {
        result.className = "result correct";
        result.innerHTML = "✨ Отлично! Все ответы правильные!";
    } else if (score >= 3) {
        result.className = "result correct";
        result.innerHTML = "💖 Хороший результат! Правильных ответов: " + score;
    } else {
        result.className = "result wrong";
        result.innerHTML = "❌ Правильных ответов: " + score + ". Попробуй ещё!";
    }
}
